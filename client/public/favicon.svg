<!-- Dwelloot mark: a loot box drawn in the theme's own language — flat fill, 2px black border, hard
     offset shadow, zero blur, zero gradient. Colors are the tokens from src/theme/tokens.ts.
     Replaces the generated Vite logo, which was 40 gaussian-blur filters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="7" y="10" width="21" height="18" rx="2" fill="#000000" />
  <rect x="4" y="7" width="21" height="18" rx="2" fill="#6C00FF" stroke="#000000" stroke-width="2" />
  <rect x="4" y="13" width="21" height="5" fill="#FFD600" stroke="#000000" stroke-width="2" />
  <rect x="11" y="7" width="7" height="18" fill="#FFD600" stroke="#000000" stroke-width="2" />
</svg>
