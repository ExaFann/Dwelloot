<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    The Dwelloot logo — task [84]. The tab icon was still Vite's placeholder mark.

    Kept byte-for-byte in step with `LogoMark` in `client/src/components/ui/icons.tsx`, which is
    the same drawing as a React component; `favicon.test.ts` parses this file and compares the
    path data, so the two cannot drift.

    A tab favicon renders at 16px, where the burst and the diamond are a few pixels across. They
    stay in deliberately: at that size they read as texture at the top of the box rather than as
    shapes, and removing them would leave a plain crate that is not the brand mark. The strokes
    are what survive the downscale and carry the silhouette.
  -->
  <g stroke="#000" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="2">
    <path
      d="M94 9 98.2 23.8 111.7 16.3 104.2 29.8 119 34 104.2 38.2 111.7 51.7 98.2 44.2 94 59 89.8 44.2 76.3 51.7 83.8 38.2 69 34 83.8 29.8 76.3 16.3 89.8 23.8Z"
      fill="#FF8A3D"
      stroke-width="6"
    />
    <path d="M24 21 37 34 24 47 11 34Z" fill="#4CC9F0" stroke-width="6" />
    <g transform="rotate(-7 64 52)">
      <path d="M18 64H110L94 36H34Z" fill="#3DDC97" />
    </g>
    <rect x="26" y="72" width="76" height="44" fill="#7C4DFF" />
    <rect x="56" y="72" width="16" height="44" fill="#FFE14A" />
  </g>
</svg>
