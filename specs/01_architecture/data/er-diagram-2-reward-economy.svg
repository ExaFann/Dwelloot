<line x1="550" y1="173" x2="610" y2="340" stroke="#999" stroke-width="1"/>
<ellipse cx="550" cy="150" rx="70" ry="23" fill="#EAF2FB" stroke="#3B77C4" stroke-width="1.5"/>
<text x="550" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1F4E86" font-family="sans-serif" text-decoration="underline">Id</text>
<line x1="750" y1="173" x2="690" y2="340" stroke="#999" stroke-width="1"/>
