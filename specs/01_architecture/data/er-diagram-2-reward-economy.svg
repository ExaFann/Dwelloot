<text x="750" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1F4E86" font-family="sans-serif">RedeemedAt</text>

<line x1="740" y1="375" x2="830" y2="375" stroke="#888" stroke-width="1.5"/>
<line x1="970" y1="375" x2="1060" y2="375" stroke="#888" stroke-width="1.5"/>
<polygon points="900,330 970,375 900,420 830,375" fill="#EAF7EE" stroke="#2E8B57" stroke-width="1.5"/>
<text x="900" y="375" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1F6B45" font-family="sans-serif">for</text>
<text x="785" y="362" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif">(1,1)</text>
<text x="1015" y="362" text-anchor="middle" font-size="12" fill="#666" font-family="sans-serif">(0,*)</text>

<rect x="1060" y="340" width="180" height="70" rx="6" fill="#FDF3E3" stroke="#C87F0A" stroke-width="1.5"/>
