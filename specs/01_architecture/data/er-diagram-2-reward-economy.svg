<text x="1250" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#1F4E86" font-family="sans-serif">Title</text>
<line x1="1150" y1="577" x2="1150" y2="410" stroke="#999" stroke-width="1"/>
