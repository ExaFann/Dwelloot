<svg width="1450" height="650" viewBox="0 0 1450 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dwelloot ER diagram 3 — progression</title>
<desc>Entity relationship diagram showing two chains: User wins Competition which is run by Household, and User earns Badge via UserBadge. User and Household are abbreviated here; full attributes are in diagram 1.</desc>

<rect x="20" y="15" width="50" height="30" rx="4" fill="#FDF3E3" stroke="#C87F0A" stroke-width="1.5"/>
<text x="80" y="34" font-size="13" fill="#333" font-family="sans-serif">Entity</text>
<ellipse cx="250" cy="30" rx="35" ry="16" fill="#EAF2FB" stroke="#3B77C4" stroke-width="1.5"/>
<text x="300" y="34" font-size="13" fill="#333" font-family="sans-serif">Attribute (underline = primary key)</text>
<polygon points="700,10 735,30 700,50 665,30" fill="#EAF7EE" stroke="#2E8B57" stroke-width="1.5"/>
<text x="750" y="34" font-size="13" fill="#333" font-family="sans-serif">Relationship</text>

<!-- Row A: User wins Competition, Competition run by Household -->
<rect x="60" y="165" width="180" height="70" rx="6" fill="#FDF3E3" stroke="#C87F0A" stroke-width="1.5"/>
