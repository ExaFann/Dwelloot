<svg width="2220" height="700" viewBox="0 0 2220 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Dwelloot ER diagram 1 — household and activity logging</title>
<desc>Entity relationship diagram showing Household, User, ActivityLog, and Activity entities, key attributes, and the belongs-to, logs, and for relationships between them.</desc>

<rect x="20" y="15" width="50" height="30" rx="4" fill="#FDF3E3" stroke="#C87F0A" stroke-width="1.5"/>
