<text x="1400" y="655" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">ApprovedByUserId references User and must differ from LoggedByUserId (see the logs relationship above)</text>

<line x1="1490" y1="375" x2="1630" y2="375" stroke="#888" stroke-width="1.5"/>
<line x1="1770" y1="375" x2="1910" y2="375" stroke="#888" stroke-width="1.5"/>
